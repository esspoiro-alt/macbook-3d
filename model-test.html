<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MacBook M5 — GLB diagnostic</title>
  <style>
    html,body{margin:0;height:100%;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #wrap{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px}
    #stage{position:relative;min-width:0}
    canvas{display:block;width:100%;height:100%}
    #panel{overflow:auto;padding:18px;background:#111;border-left:1px solid #2b2b2b}
    h1{font-size:16px;margin:0 0 12px}
    .ok{color:#70e000}.bad{color:#ff5d5d}.muted{color:#999}
    pre{white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
    button{position:absolute;top:14px;left:14px;z-index:3;border:0;border-radius:10px;padding:10px 13px;font-weight:700}
    @media(max-width:900px){#wrap{grid-template-columns:1fr;grid-template-rows:65vh auto}#panel{border-left:0;border-top:1px solid #2b2b2b}}
  </style>
</head>
<body>
<div id="wrap">
  <div id="stage"><button id="fit">Вписать модель</button><canvas id="webgl"></canvas></div>
  <aside id="panel">
    <h1>GLB diagnostic</h1>
    <div id="status" class="muted">Загружаю macbook_pro_14_inch_M5.glb…</div>
    <pre id="tree"></pre>
  </aside>
</div>
<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./model-test.js"></script>
</body>
</html>
