<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MacBook M5 — auto rig</title>
<style>
html,body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:420vh;overflow-x:hidden}
#stage{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block}
#ui{position:fixed;left:18px;right:18px;top:18px;z-index:5;background:rgba(10,10,10,.82);backdrop-filter:blur(18px);border:1px solid #2a2a2a;border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
#progress{width:100%}
#status{font-size:13px;color:#bbb;white-space:nowrap}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:700}
#debug{position:fixed;right:18px;bottom:18px;z-index:5;max-width:min(520px,42vw);max-height:42vh;overflow:auto;background:rgba(10,10,10,.78);border:1px solid #2a2a2a;border-radius:14px;padding:12px;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#bcbcbc}
#scroll-space{height:420vh;pointer-events:none}
.good{color:#78e08f}
.warn{color:#ffd166}
@media(max-width:800px){#ui{grid-template-columns:1fr;gap:8px}#debug{display:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="webgl"></canvas></div>
<div id="scroll-space" aria-hidden="true"></div>
<div id="ui">
  <strong>MacBook M5 · auto-rig</strong>
  <input id="progress" type="range" min="0" max="1" step="0.001" value="0"/>
  <button id="play">Проверить</button>
  <span id="status">загрузка…</span>
</div>
<div id="debug">Жду модель…</div>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>
<script type="module" src="./m5-test.js"></script>
</body>
</html>
